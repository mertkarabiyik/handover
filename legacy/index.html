<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: the set's energy curve is the hero; below it the running order
   with a transition strip between every two tracks, crate beside it on wide screens.
   Single theme by choice: a DJ booth is dark. */
:root {
  color-scheme: dark;
  --bg: #15121c;
  --surface: #1f1b29;
  --raise: #2a2536;
  --line: #3b3549;
  --text: #f1ecdf;
  --muted: #a69fb4;
  --accent: #ff7a2f;      /* cue-button orange */
  --good: #5fd38a;
  --warn: #f5cf4a;
  --bad: #ff4f7b;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 15px/1.45 var(--f-body);
  padding: 20px 16px 96px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand h1 {
  font: 800 clamp(34px, 9vw, 60px)/0.95 var(--f-display);
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.brand h1 span { color: var(--accent); }
.brand .slogan { margin: 10px 0 0; font: 600 clamp(15px, 4vw, 19px)/1.25 var(--f-display); color: var(--text); text-wrap: balance; }
.brand .lead { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
.top-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lang { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-height: 40px; font-size: 14px; font-weight: 500; }

.btn {
  border: 1px solid var(--line); background: var(--raise); color: var(--text);
  border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px;
  min-height: 40px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d04; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: 13px; font-weight: 500; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .35; cursor: default; }

/* ---------- tabs & views ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--text); border-bottom-color: var(--accent); }
.view { display: flex; flex-direction: column; gap: 20px; }
.view[hidden] { display: none; }
.card { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.goal-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .goal-grid { grid-template-columns: 1fr 1fr; } .goal-grid .fld:last-child { grid-column: 1 / -1; } }
.count { font: 800 clamp(26px, 7vw, 40px)/1.05 var(--f-display); color: var(--accent); }
.rds { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
@media (max-width: 620px) { .rds { grid-template-columns: 1fr; } }
.rd { display: flex; flex-direction: column; gap: 6px; }
.rd-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.rd-top b { color: var(--text); font: 500 13px var(--f-mono); white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.prac .main, .prac .fit { grid-column: 1 / -1; }
.chks { display: flex; flex-direction: column; gap: 8px; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--surface); border-radius: 10px; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.b2b { display: flex; flex-direction: column; gap: 12px; }
.b2b .lbl { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.b2b .now { background: var(--raise); }
.b2b-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.timer { font: 500 22px var(--f-mono); color: var(--warn); }
button.choice { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; }
button.choice:hover { border-color: var(--muted); }
.fb { border-left: 3px solid var(--lv); padding: 6px 0 6px 14px; display: flex; flex-direction: column; gap: 8px; }
.fb p { margin: 0; }
.fb .why { color: var(--muted); font-size: 13px; }
.b2b-acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- example banner ---------- */
.notice {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px;
  color: var(--muted); font-size: 14px;
}
.notice strong { color: var(--text); font-weight: 600; }
.notice[hidden] { display: none; }

/* ---------- hero: stats + energy ---------- */
.hero { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 12px 20px; }
.stat .lbl { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.stat .val { font: 500 22px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .val small { font-size: 13px; color: var(--muted); }
.tally { display: flex; gap: 10px; align-items: center; }
.tally span { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.c0 { background: var(--good); } .c1 { background: var(--warn); } .c2 { background: var(--bad); }
@media (max-width: 620px) { .stats { grid-template-columns: 1fr 1fr; justify-content: start; } }
#chart { width: 100%; }
#chart svg { display: block; width: 100%; height: auto; }
#chart text { font: 400 11px var(--f-mono); fill: var(--muted); }
.chart-cap { font-size: 12px; color: var(--muted); margin: -6px 0 0; }

/* ---------- columns ---------- */
.cols { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: 1.35fr 1fr; } }
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.panel-head h2 { font: 600 15px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.panel-head .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; margin: -4px 0 0; }

/* ---------- track rows ---------- */
ol.list, ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.trk {
  background: var(--surface); border-radius: 10px; padding: 10px 12px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center;
}
ul.list .trk { grid-template-columns: minmax(0, 1fr) auto; }
ul.list { gap: 8px; }
.num { font: 500 13px var(--f-mono); color: var(--muted); width: 22px; }
.ttl { font-weight: 600; overflow-wrap: anywhere; }
.ex { font: 400 10px var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 8px; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.bpm small { color: var(--muted); font-weight: 400; }
.key {
  --c: hsl(var(--h) 72% 70%);
  min-width: 38px; text-align: center; border-radius: 6px; padding: 2px 6px;
  border: 1.5px solid var(--c);
}
.key.maj { background: var(--c); color: #17131f; }
.key.min { color: var(--c); }
.key.none { border-color: var(--line); color: var(--muted); }
.en { display: inline-flex; align-items: center; gap: 5px; }
.en i { display: block; width: 30px; height: 5px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.en i b { display: block; height: 100%; background: var(--text); }
.acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.fit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); }

/* transition strip between two set tracks */
.tr {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
  margin: 0 0 0 22px; padding: 7px 0 7px 14px;
  border-left: 3px solid var(--lv); font-size: 13px; color: var(--muted);
}
.lv0 { --lv: var(--good); } .lv1 { --lv: var(--warn); } .lv2 { --lv: var(--bad); }
.pill {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 500 12px var(--f-mono); color: var(--lv);
  border: 1px solid var(--lv); border-radius: 999px; padding: 1px 9px 1px 7px;
}
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 14px; color: var(--muted); text-align: left; }

/* legend */
.legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.legend div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.foot { color: var(--muted); font-size: 12px; }

/* ---------- dialog ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text);
  padding: 18px; width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px);
}
dialog::backdrop { background: rgba(8, 6, 12, .7); }
dialog h2 { font: 600 16px var(--f-display); text-transform: uppercase; margin-bottom: 14px; }
form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld label, .fld .lab { font-size: 12px; color: var(--muted); }
.fld input[type=text], .fld input[type=number], .fld input[type=date], .fld select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-height: 40px;
}
.row { display: flex; gap: 8px; align-items: center; }
.row input { flex: 1; min-width: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.dlg-acts { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.err { grid-column: 1 / -1; color: var(--bad); font-size: 13px; min-height: 1em; margin: 0; }
textarea { min-height: 220px; font: 400 12px/1.5 var(--f-mono); resize: vertical; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: #17131f; border-radius: 10px; padding: 8px 8px 8px 14px;
  display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500;
  max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
.toast[hidden] { display: none; }
.toast button { background: #17131f; color: var(--text); border: 0; border-radius: 7px; padding: 6px 12px; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: border-color .15s, filter .15s; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <h1 lang="en">Hand<span>o</span>ver</h1>
      <p class="slogan" data-i18n="slogan"></p>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="top-acts">
      <select class="lang" id="lang" data-i18n-aria="langLabel">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
      <button class="btn primary" data-act="new" id="btnNew" data-i18n="add"></button>
    </div>
  </header>

  <nav class="tabs">
    <a href="#set" id="tab-set" data-i18n="tabSet"></a>
    <a href="#prep" id="tab-prep" data-i18n="tabPrep"></a>
    <a href="#b2b" id="tab-b2b" data-i18n="tabB2b"></a>
  </nav>

  <div class="view" id="v-set">
  <div class="notice" id="notice" hidden>
    <span><strong data-i18n="exStrong"></strong> <span data-i18n="exRest"></span></span>
    <button class="btn small" data-act="clear-ex" data-i18n="exClear"></button>
  </div>

  <section class="hero">
    <div class="stats" id="stats"></div>
    <div id="chart" role="img" data-i18n-aria="chartAria"></div>
    <p class="chart-cap" data-i18n="chartCap"></p>
  </section>

  <div class="cols">
    <section class="panel" aria-labelledby="hSet">
      <div class="panel-head">
        <h2 id="hSet" data-i18n="setTitle"></h2>
        <div class="tools">
          <button class="btn small" data-act="auto" id="btnAuto" data-i18n="auto"></button>
          <button class="btn small" data-act="copy" id="btnCopy" data-i18n="copy"></button>
        </div>
      </div>
      <ol class="list" id="setList"></ol>
      <div class="legend">
        <div><span class="pill lv0" data-lv="0"></span> <span data-i18n="legend0"></span></div>
        <div><span class="pill lv1" data-lv="1"></span> <span data-i18n="legend1"></span></div>
        <div><span class="pill lv2" data-lv="2"></span> <span data-i18n="legend2"></span></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="hCrate">
      <div class="panel-head">
        <h2 id="hCrate" data-i18n="crate"></h2>
        <div class="tools"><button class="btn small" data-act="new" data-i18n="add"></button></div>
      </div>
      <p class="hint" id="crateHint"></p>
      <ul class="list" id="crateList"></ul>
    </section>
  </div>

  <p class="foot" data-i18n="foot"></p>
  </div>

  <div class="view" id="v-prep" hidden>
    <section class="card">
      <div class="panel-head"><h2 data-i18n="goalTitle"></h2></div>
      <div class="goal-grid">
        <div class="fld"><label for="g-date" data-i18n="goalDate"></label><input type="date" id="g-date"></div>
        <div class="fld"><label for="g-min" data-i18n="goalMin"></label><input type="number" id="g-min" min="10" max="600" step="5" inputmode="numeric"></div>
        <div class="fld"><label for="g-venue" data-i18n="goalVenue"></label><select id="g-venue"></select></div>
      </div>
      <div id="ready"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 data-i18n="pracTitle"></h2></div>
      <p class="hint" data-i18n="pracHint"></p>
      <ul class="list" id="pracList"></ul>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 data-i18n="chkTitle"></h2></div>
      <div class="chks" id="chkList"></div>
    </section>
  </div>

  <div class="view" id="v-b2b" hidden>
    <section class="card">
      <div class="panel-head"><h2 data-i18n="b2bTitle"></h2></div>
      <p class="hint" style="margin:0" data-i18n="b2bIntro"></p>
      <div class="b2b" id="b2bBox"></div>
    </section>
  </div>
</div>

<!-- add / edit -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle"></h2>
  <form class="grid" id="frm" novalidate>
    <div class="fld wide"><label for="f-title" data-i18n="fTitle"></label><input type="text" id="f-title" maxlength="120" autocomplete="off"></div>
    <div class="fld wide"><label for="f-artist" data-i18n="fArtist"></label><input type="text" id="f-artist" maxlength="120" autocomplete="off"></div>
    <div class="fld">
      <label for="f-bpm">BPM</label>
      <div class="row"><input type="number" id="f-bpm" min="40" max="220" step="0.1" inputmode="decimal"><button type="button" class="btn small" id="tap" data-i18n-title="tapTitle">Tap</button></div>
    </div>
    <div class="fld"><label for="f-key" data-i18n="fKey"></label><select id="f-key"></select></div>
    <div class="fld"><label for="f-energy"><span data-i18n="fEnergy"></span>: <output id="f-energy-out">5</output>/10</label><input type="range" id="f-energy" min="1" max="10" step="1" value="5"></div>
    <div class="fld"><label for="f-dur" data-i18n="fDur"></label><input type="text" id="f-dur" placeholder="5:30" inputmode="numeric" autocomplete="off"></div>
    <label class="check fld wide" for="f-toset"><input type="checkbox" id="f-toset" checked> <span data-i18n="fToSet"></span></label>
    <p class="err" id="f-err" role="alert"></p>
    <div class="dlg-acts">
      <button type="button" class="btn ghost" data-act="close-dlg" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<!-- copy fallback -->
<dialog id="copyDlg" aria-labelledby="copyTitle">
  <h2 id="copyTitle" data-i18n="copyTitle"></h2>
  <p class="hint" style="margin:0 0 10px" data-i18n="copyHint"></p>
  <textarea id="copyText" readonly></textarea>
  <div class="dlg-acts" style="margin-top:12px"><button class="btn" data-act="close-copy" data-i18n="close"></button></div>
</dialog>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo" data-act="undo" data-i18n="undo"></button></div>

  function durTxt(s) { return s ? Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) : ''; }
  function parseDur(v) {
    v = (v || '').trim();
    if (!v) return 0;
    var m = /^(\d{1,3})[:.,](\d{1,2})$/.exec(v);
    if (m) return +m[1] * 60 + Math.min(59, +m[2]);
    if (/^\d{1,3}$/.test(v)) return +v * 60;
    return -1;
  }
  function totalTxt(s) {
    var m = Math.round(s / 60);
    return m >= 60 ? Math.floor(m / 60) + '<small> ' + t('uH') + ' </small>' + ('0' + (m % 60)).slice(-2) + '<small> ' + t('uM') + '</small>' : m + '<small> ' + t('uM') + '</small>';
  }
  function keyChip(k) {
    var p = parseKey(k);
    if (!p) return '<span class="key none" title="' + esc(t('keyNone')) + '">–</span>';
    var h = ((p.n - 1) * 30 + 150) % 360;
    return '<span class="key ' + (p.l === 'B' ? 'maj' : 'min') + '" style="--h:' + h + '" title="' + esc(KEYS[k]) + '">' + k + '</span>';
  }
  function metaHtml(tr) {
    return '<div class="meta"><span class="bpm">' + bpmTxt(tr.bpm) + '<small> BPM</small></span>' + keyChip(tr.key) +
      '<span class="en" title="' + esc(t('energyTitle', tr.energy)) + '">E' + tr.energy + '<i><b style="width:' + tr.energy * 10 + '%"></b></i></span></div>';
  }
  function mainHtml(tr) {
    var sub = [tr.artist, durTxt(tr.dur)].filter(Boolean).map(esc).join(' · ');
    return '<div class="main"><div class="ttl">' + esc(tr.title) + (tr.ex ? '<span class="ex">' + esc(t('exTag')) + '</span>' : '') + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  }
  function pill(lv) { return '<span class="pill lv' + lv + '">' + LV_I[lv] + ' ' + esc(t('lv' + lv)) + '</span>'; }

  /* ---------- render ---------- */
  function render() {
    var set = setTracks(), crate = crateTracks(), trs = [], i;
    for (i = 1; i < set.length; i++) trs.push(transition(set[i - 1], set[i]));

    $('#notice').hidden = !state.tracks.some(function (x) { return x.ex; });

    // stats
    var total = set.reduce(function (sum, x) { return sum + (x.dur || 0); }, 0);
    var bpms = set.map(function (x) { return x.bpm; });
    var cnt = [0, 0, 0];
    trs.forEach(function (x) { cnt[x.lv]++; });
    $('#stats').innerHTML =
      '<div class="stat"><div class="lbl">' + esc(t('stTracks')) + '</div><div class="val">' + set.length + '</div></div>' +
      '<div class="stat"><div class="lbl">' + esc(t('stTotal')) + '</div><div class="val">' + (total ? totalTxt(total) : '–') + '</div></div>' +
      '<div class="stat"><div class="lbl">' + esc(t('stBpm')) + '</div><div class="val">' + (bpms.length ? bpmTxt(Math.min.apply(null, bpms)) + '–' + bpmTxt(Math.max.apply(null, bpms)) : '–') + '</div></div>' +
      '<div class="stat"><div class="lbl">' + esc(t('stTrans')) + '</div><div class="val tally">' +
        [0, 1, 2].map(function (l) { return '<span title="' + esc(t('lv' + l)) + '"><i class="dot c' + l + '"></i>' + cnt[l] + '</span>'; }).join('') + '</div></div>';

    // set list
    var h = '';
    set.forEach(function (x, k) {
      if (k > 0) {
        var tr = trs[k - 1];
        h += '<li class="tr lv' + tr.lv + '">' + pill(tr.lv) + '<span>' + esc(tr.parts.join(' · ')) + '</span></li>';
      }
      h += '<li class="trk"><span class="num">' + ('0' + (k + 1)).slice(-2) + '</span>' + mainHtml(x) + metaHtml(x) +
        '<div class="acts">' +
        '<button class="btn small" data-act="up" data-id="' + x.id + '"' + (k === 0 ? ' disabled' : '') + ' aria-label="' + esc(t('up')) + '">↑</button>' +
        '<button class="btn small" data-act="down" data-id="' + x.id + '"' + (k === set.length - 1 ? ' disabled' : '') + ' aria-label="' + esc(t('down')) + '">↓</button>' +
        '<button class="btn small" data-act="edit" data-id="' + x.id + '">' + esc(t('edit')) + '</button>' +
        '<button class="btn small" data-act="out" data-id="' + x.id + '">' + esc(t('toCrate')) + '</button>' +
        '</div></li>';
    });
    $('#setList').innerHTML = h || '<li class="empty">' + esc(t('setEmpty')) + '</li>';
    $('#btnAuto').disabled = set.length < 3;
    $('#btnCopy').disabled = set.length === 0;

    // crate, ranked against the last track of the set
    var last = set[set.length - 1];
    if (last) crate.sort(function (p, q) { return fitScore(last, p) - fitScore(last, q); });
    else crate.sort(function (p, q) { return p.energy - q.energy; });
    $('#crateHint').textContent = !crate.length ? '' : last ? t('crateHintFit', last.title) : t('crateHintNoSet');
    h = '';
    crate.forEach(function (x) {
      var fit = '';
      if (last) { var tr = transition(last, x); fit = '<div class="fit lv' + tr.lv + '">' + pill(tr.lv) + '<span>' + esc(tr.parts.join(' · ')) + '</span></div>'; }
      h += '<li class="trk">' + mainHtml(x) + metaHtml(x) + fit +
        '<div class="acts">' +
        '<button class="btn small" data-act="del" data-id="' + x.id + '">' + esc(t('del')) + '</button>' +
        '<button class="btn small" data-act="edit" data-id="' + x.id + '">' + esc(t('edit')) + '</button>' +
        '<button class="btn small primary" data-act="in" data-id="' + x.id + '">' + esc(t('toSet')) + '</button>' +
        '</div></li>';
    });
    $('#crateList').innerHTML = h || '<li class="empty">' + esc(t('crateEmpty')) + '</li>';

    drawChart(set, trs);
    renderPrep(set, trs);
  }

  /* ---------- prep coach ---------- */
  var CHECKS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7'];
  function meter(label, val, max, txt) {
    var p = max > 0 ? Math.max(0, Math.min(100, Math.round(val / max * 100))) : 0;
    return '<div class="rd"><div class="rd-top"><span>' + esc(label) + '</span><b>' + txt + '</b></div><div class="bar"><i style="width:' + p + '%"></i></div></div>';
  }
  function renderPrep(set, trs) {
    var g = state.goal, head, items = [], done = 0, h = '';
    if (g.date) {
      var d = Math.round((new Date(g.date + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
      head = '<div class="count">' + esc(isNaN(d) ? '' : d > 0 ? t('daysLeft', d) : d === 0 ? t('dayToday') : t('dayPast')) + '</div>';
    } else head = '<p class="hint" style="margin:0">' + esc(t('goalNone')) + '</p>';

    trs.forEach(function (tr, i) { if (tr.lv > 0) items.push({ a: set[i], b: set[i + 1], tr: tr, key: set[i].id + '>' + set[i + 1].id }); });
    items.forEach(function (it) {
      var r = state.rehearse[it.key];
      if (r && r.last === 'ok') done++;
      h += '<li class="trk prac"><div class="main"><div class="ttl">' + esc(it.a.title) + ' → ' + esc(it.b.title) + '</div></div>' +
        '<div class="fit lv' + it.tr.lv + '">' + pill(it.tr.lv) + '<span>' + esc(it.tr.parts.join(' · ')) + '</span></div>' +
        '<div class="fit"><span>' + esc(r ? t('pracLog', r.n, t(r.last === 'ok' ? 'pracOk' : 'pracFail')) : t('pracNever')) + '</span></div>' +
        '<div class="acts"><button class="btn small" data-act="prac-fail" data-key="' + it.key + '">' + esc(t('pracFail')) + '</button>' +
        '<button class="btn small primary" data-act="prac-ok" data-key="' + it.key + '">' + esc(t('pracOk')) + '</button></div></li>';
    });
    $('#pracList').innerHTML = h || '<li class="empty">' + esc(t('pracEmpty')) + '</li>';

    var nChk = CHECKS.filter(function (c) { return state.checks[c]; }).length;
    $('#chkList').innerHTML = CHECKS.map(function (c) {
      return '<label class="chk"><input type="checkbox" data-chk="' + c + '"' + (state.checks[c] ? ' checked' : '') + '><span>' + esc(t(c)) + '</span></label>';
    }).join('');

    var mins = Math.round(set.reduce(function (sum, x) { return sum + (x.dur || 0); }, 0) / 60), want = +g.minutes || 0;
    $('#ready').innerHTML = head + '<div class="rds">' +
      meter(t('rdSet'), mins, want, mins + ' / ' + (want || '–') + ' ' + esc(t('uM'))) +
      meter(t('rdPrac'), items.length ? done : 1, items.length || 1, items.length ? done + ' / ' + items.length : '–') +
      meter(t('rdCheck'), nChk, CHECKS.length, nChk + ' / ' + CHECKS.length) + '</div>';
  }

  /* ---------- virtual B2B partner ---------- */
  var b2b = { on: false, useTimer: false, cur: null, opts: [], pick: null, timeUp: false, tally: [0, 0, 0], n: 0, left: 0, tm: null, done: null };
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function b2bStop() { clearInterval(b2b.tm); b2b.tm = null; }
  function b2bRank(p, q) { return transition(b2b.cur, p).lv - transition(b2b.cur, q).lv || fitScore(b2b.cur, p) - fitScore(b2b.cur, q); }
  function b2bNext() {
    b2bStop();
    var pool = state.tracks.filter(function (x) { return !b2b.cur || x.id !== b2b.cur.id; });
    b2b.cur = pool[Math.floor(Math.random() * pool.length)];
    var others = state.tracks.filter(function (x) { return x.id !== b2b.cur.id; });
    var best = others.slice().sort(b2bRank)[0];
    var opts = shuffle(others.filter(function (x) { return x.id !== best.id; })).slice(0, 5);
    opts.push(best);
    b2b.opts = shuffle(opts); b2b.pick = null; b2b.timeUp = false; b2b.n++;
    if (b2b.useTimer) {
      b2b.left = 20;
      b2b.tm = setInterval(function () {
        b2b.left--;
        if (b2b.left <= 0) { b2bStop(); b2b.timeUp = true; b2b.tally[2]++; renderB2b(); }
        else { var el = $('#b2b-left'); if (el) el.textContent = b2b.left; }
      }, 1000);
    }
    renderB2b();
  }
  function renderB2b() {
    var box = $('#b2bBox'), h = '';
    if (state.tracks.length < 4) { b2bStop(); b2b.on = false; box.innerHTML = '<div class="empty">' + esc(t('b2bNeed')) + '</div>'; return; }
    if (b2b.on && (!b2b.cur || !byId(b2b.cur.id) || b2b.opts.some(function (x) { return !byId(x.id); }))) { b2bStop(); b2b.on = false; }
    if (!b2b.on) {
      if (b2b.done) h += '<p style="margin:0">' + esc(t('b2bSummary', b2b.done.n, b2b.done.tally[0], b2b.done.tally[1], b2b.done.tally[2])) + '</p>';
      h += '<label class="check"><input type="checkbox" id="b2b-timer"' + (b2b.useTimer ? ' checked' : '') + '> ' + esc(t('b2bTimer')) + '</label>' +
        '<div class="b2b-acts"><button class="btn primary" data-act="b2b-start">' + esc(t('b2bStart')) + '</button></div>';
      box.innerHTML = h; return;
    }
    var answered = b2b.pick || b2b.timeUp;
    h += '<div class="b2b-top"><span class="lbl">' + esc(t('b2bRound', b2b.n)) + ' · ' + esc(t('b2bPartner')) + '</span>' +
      (b2b.useTimer && !answered ? '<span class="timer" id="b2b-left">' + b2b.left + '</span>' : '') + '</div>' +
      '<div class="trk now" style="grid-template-columns:minmax(0,1fr) auto">' + mainHtml(b2b.cur) + metaHtml(b2b.cur) + '</div>';
    if (!answered) {
      h += '<span class="lbl">' + esc(t('b2bPick')) + '</span>';
      b2b.opts.forEach(function (x) {
        h += '<button class="trk choice" style="grid-template-columns:minmax(0,1fr) auto" data-act="b2b-pick" data-id="' + x.id + '">' + mainHtml(x) + metaHtml(x) + '</button>';
      });
    } else {
      var best = b2b.opts.slice().sort(b2bRank)[0], bt = transition(b2b.cur, best);
      var pt = b2b.pick ? transition(b2b.cur, b2b.pick) : null, lv = pt ? pt.lv : 2;
      h += '<div class="fb lv' + lv + '">';
      if (pt) h += '<p><strong>' + esc(t('b2bYou', b2b.pick.title)) + '</strong></p><p>' + pill(pt.lv) + '</p><p class="why">' + esc(pt.parts.join(' · ')) + '</p>';
      else h += '<p><strong>' + esc(t('b2bTimeUp')) + '</strong></p>';
      if (!pt || bt.lv < pt.lv) h += '<p>' + esc(t('b2bBetter', best.title)) + ' <span class="lv' + bt.lv + '">' + pill(bt.lv) + '</span></p><p class="why">' + esc(bt.parts.join(' · ')) + '</p>';
      else h += '<p>' + esc(t('b2bBest')) + '</p>';
      h += '</div><div class="b2b-acts"><button class="btn primary" data-act="b2b-next">' + esc(t('b2bNext')) + '</button>' +
        '<button class="btn" data-act="b2b-end">' + esc(t('b2bEnd')) + '</button></div>';
    }
    box.innerHTML = h;
  }

  /* ---------- views ---------- */
  var VIEWS = ['set', 'prep', 'b2b'];
  function showView() {
    var v = (location.hash || '').slice(1);
    if (VIEWS.indexOf(v) < 0) v = 'set';
    VIEWS.forEach(function (n) {
      $('#v-' + n).hidden = n !== v;
      var a = $('#tab-' + n);
      a.classList.toggle('on', n === v);
      if (n === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (v === 'set') render();
    if (v === 'b2b') renderB2b();
  }

  function drawChart(set, trs) {
    var box = $('#chart'), W = Math.max(280, box.clientWidth || 600), H = 150;
    var L = 26, R = 12, T = 12, B = 24, n = set.length;
    var col = ['var(--good)', 'var(--warn)', 'var(--bad)'];
    function x(i) { return n === 1 ? L + (W - L - R) / 2 : L + (W - L - R) * i / (n - 1); }
    function y(e) { return T + (H - T - B) * (10 - e) / 9; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
    [1, 4, 7, 10].forEach(function (e) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(e) + '" y2="' + y(e) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>' +
        '<text x="' + (L - 8) + '" y="' + (y(e) + 4) + '" text-anchor="end">' + e + '</text>';
    });
    if (!n) {
      s += '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle">' + esc(t('chartEmpty')) + '</text>';
    } else {
      if (n > 1) {
        var area = 'M' + x(0) + ' ' + y(1);
        set.forEach(function (o, i) { area += ' L' + x(i) + ' ' + y(o.energy); });
        s += '<path d="' + area + ' L' + x(n - 1) + ' ' + y(1) + ' Z" fill="url(#g)"/>';
        for (var i = 1; i < n; i++)
          s += '<line x1="' + x(i - 1) + '" y1="' + y(set[i - 1].energy) + '" x2="' + x(i) + '" y2="' + y(set[i].energy) + '" stroke="' + col[trs[i - 1].lv] + '" stroke-width="3" stroke-linecap="round"/>';
      }
      var step = Math.ceil(n / Math.max(1, Math.floor((W - L - R) / 26)));
      set.forEach(function (o, i) {
        s += '<circle cx="' + x(i) + '" cy="' + y(o.energy) + '" r="4.5" fill="var(--surface)" stroke="var(--text)" stroke-width="2"/>';
        if (i % step === 0) s += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + (i + 1) + '</text>';
      });
    }
    box.innerHTML = s + '</svg>';
  }

  /* ---------- actions ---------- */
  function snap() { undoSnap = JSON.stringify(state); }
  function toast(msg, withUndo) {
    $('#toastMsg').textContent = msg;
    $('#toastUndo').hidden = !withUndo;
    $('#toast').hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('#toast').hidden = true; }, withUndo ? 7000 : 2500);
  }
  function commit() { save(); render(); }

  function setText() {
    var set = setTracks(), lines = [t('textHead', set.length), ''];
    set.forEach(function (x, i) {
      if (i > 0) { var tr = transition(set[i - 1], x); lines.push('    ↓ ' + t('lv' + tr.lv) + ': ' + tr.parts.join(' · ')); }
      lines.push((i + 1) + '. ' + x.title + (x.artist ? ' – ' + x.artist : '') + ' | ' + bpmTxt(x.bpm) + ' BPM | ' + (x.key || '–') + ' | E' + x.energy + (x.dur ? ' | ' + durTxt(x.dur) : ''));
    });
    return lines.join('\n');
  }

  function openForm(id) {
    editId = id || null;
    var x = id ? byId(id) : null;
    $('#dlgTitle').textContent = t(x ? 'dlgEdit' : 'dlgAdd');
    $('#f-title').value = x ? x.title : '';
    $('#f-artist').value = x ? x.artist : '';
    $('#f-bpm').value = x ? x.bpm : '';
    $('#f-key').value = x ? (x.key || '') : '';
    $('#f-energy').value = x ? x.energy : 5;
    $('#f-energy-out').textContent = $('#f-energy').value;
    $('#f-dur').value = x ? durTxt(x.dur) : '';
    $('#f-toset').checked = true;
    $('#f-toset').closest('label').style.display = x ? 'none' : '';
    $('#f-err').textContent = '';
    taps = [];
    $('#dlg').showModal();
    if (!x) $('#f-title').focus();
  }

  function submitForm(e) {
    e.preventDefault();
    var title = $('#f-title').value.trim(), bpm = parseFloat(String($('#f-bpm').value).replace(',', '.')), dur = parseDur($('#f-dur').value);
    if (!title) { $('#f-err').textContent = t('errTitle'); $('#f-title').focus(); return; }
    if (!(bpm >= 40 && bpm <= 220)) { $('#f-err').textContent = t('errBpm'); $('#f-bpm').focus(); return; }
    if (dur < 0) { $('#f-err').textContent = t('errDur'); $('#f-dur').focus(); return; }
    var data = { title: title, artist: $('#f-artist').value.trim(), bpm: Math.round(bpm * 10) / 10, key: $('#f-key').value, energy: +$('#f-energy').value, dur: dur };
    if (editId) {
      var x = byId(editId);
      if (x) { Object.keys(data).forEach(function (k) { x[k] = data[k]; }); delete x.ex; }
    } else {
      data.id = uid();
      state.tracks.push(data);
      if ($('#f-toset').checked) state.set.push(data.id);
    }
    $('#dlg').close();
    commit();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act, id = b.dataset.id, i = state.set.indexOf(id);
    if (act === 'new') openForm();
    else if (act === 'edit') openForm(id);
    else if (act === 'close-dlg') $('#dlg').close();
    else if (act === 'close-copy') $('#copyDlg').close();
    else if (act === 'up' && i > 0) { state.set.splice(i - 1, 0, state.set.splice(i, 1)[0]); commit(); }
    else if (act === 'down' && i >= 0 && i < state.set.length - 1) { state.set.splice(i + 1, 0, state.set.splice(i, 1)[0]); commit(); }
    else if (act === 'out' && i >= 0) { state.set.splice(i, 1); commit(); }
    else if (act === 'in') { if (i < 0) state.set.push(id); commit(); }
    else if (act === 'del') {
      snap();
      state.tracks = state.tracks.filter(function (x) { return x.id !== id; });
      commit(); toast(t('tDeleted'), true);
    }
    else if (act === 'clear-ex') {
      snap();
      state.tracks = state.tracks.filter(function (x) { return !x.ex; });
      state.set = state.set.filter(function (sid) { return byId(sid); });
      commit(); toast(t('tExCleared'), true);
    }
    else if (act === 'auto') {
      snap();
      state.set = autoOrder(setTracks()).map(function (x) { return x.id; });
      commit(); toast(t('tSorted'), true);
    }
    else if (act === 'prac-ok' || act === 'prac-fail') {
      var k = b.dataset.key, r = state.rehearse[k] || { n: 0 };
      r.n++; r.last = act === 'prac-ok' ? 'ok' : 'fail';
      state.rehearse[k] = r; commit();
    }
    else if (act === 'b2b-start') { b2b.on = true; b2b.n = 0; b2b.tally = [0, 0, 0]; b2b.cur = null; b2b.done = null; b2bNext(); }
    else if (act === 'b2b-pick') {
      b2bStop();
      b2b.pick = byId(id);
      if (b2b.pick) { b2b.tally[transition(b2b.cur, b2b.pick).lv]++; }
      renderB2b();
    }
    else if (act === 'b2b-next') b2bNext();
    else if (act === 'b2b-end') {
      b2bStop();
      b2b.done = { n: b2b.tally[0] + b2b.tally[1] + b2b.tally[2], tally: b2b.tally.slice() };
      b2b.on = false; renderB2b();
    }
    else if (act === 'undo') {
      if (undoSnap) { try { state = JSON.parse(undoSnap); } catch (err) {} undoSnap = null; commit(); renderB2b(); }
      $('#toast').hidden = true;
    }
    else if (act === 'copy') {
      var txt = setText();
      var fallback = function () { $('#copyText').value = txt; $('#copyDlg').showModal(); $('#copyText').select(); };
      try {
        navigator.clipboard.writeText(txt).then(function () { toast(t('tCopied'), false); }, fallback);
      } catch (err) { fallback(); }
    }
  });

  // form wiring
  function buildKeyOptions() {
    var sel = $('#f-key'), cur = sel.value, opts = '<option value="">' + esc(t('keyUnknown')) + '</option>';
    ['A', 'B'].forEach(function (l) {
      opts += '<optgroup label="' + esc(t(l === 'A' ? 'minor' : 'major')) + '">';
      for (var n = 1; n <= 12; n++) opts += '<option value="' + n + l + '">' + n + l + ' · ' + KEYS[n + l] + '</option>';
      opts += '</optgroup>';
    });
    sel.innerHTML = opts;
    sel.value = cur;
  }
  $('#lang').value = lang;
  $('#lang').addEventListener('change', function () {
    lang = this.value;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic(); render(); renderB2b();
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'g-date' || el.id === 'g-min' || el.id === 'g-venue') {
      state.goal = { date: $('#g-date').value, minutes: Math.max(0, Math.round(+$('#g-min').value || 0)), venue: $('#g-venue').value };
      commit();
    } else if (el.dataset && el.dataset.chk) { state.checks[el.dataset.chk] = el.checked; commit(); }
    else if (el.id === 'b2b-timer') b2b.useTimer = el.checked;
  });
  window.addEventListener('hashchange', showView);
  $('#frm').addEventListener('submit', submitForm);
  $('#f-energy').addEventListener('input', function () { $('#f-energy-out').textContent = this.value; });

  var taps = [];
  $('#tap').addEventListener('click', function () {
    var now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
    taps.push(now);
    if (taps.length > 8) taps.shift();
    if (taps.length >= 3) $('#f-bpm').value = Math.round(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
  });

  var rz;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(render, 120); });

  applyStatic();
  $('#g-date').value = state.goal.date || '';
  $('#g-min').value = state.goal.minutes || 60;
  $('#g-venue').value = state.goal.venue || 'house';
  render();
  renderB2b();
  showView();
})();
</script>
</body>
</html>
